<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">
    <ion-grid class="login-grid">
      <ion-row class="ion-justify-content-center">
        <ion-col size="12" size-md="8" size-lg="6" size-xl="4">
          <div class="login-container">
            <!-- Logo và App Name -->
            <div class="logo-section">
              <div class="logo">
                <div class="logo-h">H</div>
              </div>
              <ion-text color="dark">
                <h1 class="app-name">HRM<span class="plus">+</span></h1>
              </ion-text>
            </div>

            <!-- Title -->
            <ion-text color="dark">
              <h2 class="login-title">Log in</h2>
            </ion-text>

            <!-- Social Login Card -->
            <ion-card class="login-card">
              <ion-card-content>
                <div class="social-login-container">
                  <!-- Error Message -->
                  <ion-item lines="none" *ngIf="errorMessage" class="error-item">
                    <ion-icon name="alert-circle-outline" slot="start" color="danger"></ion-icon>
                    <ion-label>
                      <p class="error-message">{{ errorMessage }}</p>
                    </ion-label>
                  </ion-item>

                  <!-- Google Login Button -->
                  <div class="google-button-wrapper">
                    <ion-button expand="block" class="social-login-button google-button" (click)="onGoogleLogin()"
                      [disabled]="isLoading">
                      <ion-spinner *ngIf="isLoading && loginProvider === 'google'" name="crescent"
                        class="ion-margin-end"></ion-spinner>
                      <ion-icon name="logo-google" slot="start"
                        *ngIf="!(isLoading && loginProvider === 'google')"></ion-icon>
                      <span *ngIf="!(isLoading && loginProvider === 'google')">Đăng nhập bằng Google</span>
                      <span *ngIf="isLoading && loginProvider === 'google'">Đang đăng nhập...</span>
                    </ion-button>
                  </div>

                  <!-- Divider -->
                  <div class="divider">
                    <span class="divider-text">hoặc</span>
                  </div>

                  <!-- Facebook Login Button -->
                  <ion-button expand="block" class="social-login-button facebook-button" (click)="onFacebookLogin()"
                    [disabled]="isLoading">
                    <ion-spinner *ngIf="isLoading && loginProvider === 'facebook'" name="crescent"
                      class="ion-margin-end"></ion-spinner>
                    <ion-icon name="logo-facebook" slot="start"
                      *ngIf="!(isLoading && loginProvider === 'facebook')"></ion-icon>
                    <span *ngIf="!(isLoading && loginProvider === 'facebook')">Đăng nhập bằng Facebook</span>
                    <span *ngIf="isLoading && loginProvider === 'facebook'">Đang đăng nhập...</span>
                  </ion-button>
                </div>
              </ion-card-content>
            </ion-card>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
