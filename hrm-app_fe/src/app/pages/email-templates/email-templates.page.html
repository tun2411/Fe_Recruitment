<ion-header class="custom-header">
  <ion-toolbar color="primary">
    <ion-buttons slot="start" *ngIf="showSamplesList">
      <ion-button (click)="backToRounds()">
        <span style="font-size: 24px;">‹</span>
      </ion-button>
    </ion-buttons>
    <ion-title>EMAIL TỰ ĐỘNG</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Chỉ hiển thị nội dung khi có query params hợp lệ -->
  <div *ngIf="hasValidParams">
    <!-- Hiển thị list samples -->
    <div *ngIf="showSamplesList">
    <ion-list>
      <ion-item button *ngFor="let sample of (samples || []); let i = index" (click)="selectTemplate(sample)">
        <ion-label>{{getTemplateDisplayName(sample) || 'Template ' + (i + 1)}}</ion-label>
      </ion-item>
    </ion-list>
    <ion-button expand="block" fill="outline" (click)="openTemplateEditor()" style="margin-top: 20px;">
      Tạo mới
    </ion-button>
  </div>
  </div>
</ion-content>
