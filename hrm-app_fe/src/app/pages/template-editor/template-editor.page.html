<ion-header class="custom-header">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title class="header-title">TẠO MAIL</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="template-editor-content">
  <div class="template-editor-container">
    <!-- List mẫu email (nếu có) -->
    <ion-list *ngIf="samples && samples.length > 0" class="sample-list">
      <ion-item button *ngFor="let sample of samples" (click)="selectSample(sample)">
        <ion-label>{{ sample.sampleName || sample.name }}</ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>
    </ion-list>

    <!-- Form editor -->
    <form [formGroup]="templateForm" class="template-form">
      <!-- Tên form -->
      <ion-item lines="none" class="form-item">
        <ion-label position="stacked">Tên form</ion-label>
        <ion-input formControlName="formName" placeholder="Tên"></ion-input>
      </ion-item>

      <!-- Tiêu đề -->
      <ion-item lines="none" class="form-item">
        <ion-label position="stacked">Tiêu đề</ion-label>
        <ion-input formControlName="subject" placeholder="Tiêu đề mail"></ion-input>
      </ion-item>

      <!-- Nội dung -->
      <ion-item lines="none" class="form-item">
        <ion-label position="stacked">Nội dung</ion-label>
        <ion-textarea formControlName="content" rows="10" autoGrow="true" placeholder="Nhập nội dung email...">
        </ion-textarea>
      </ion-item>

      <!-- Placeholders helper -->
      <div class="placeholders-section">
        <div class="placeholders-label">Placeholders:</div>
        <div class="placeholders-buttons">
          <ion-button size="small" fill="outline" *ngFor="let placeholder of placeholders"
            (click)="insertPlaceholder(placeholder)">
            {{ placeholder }}
          </ion-button>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="action-buttons">
        <ion-button expand="block" fill="outline" (click)="onCancel()" class="cancel-button">
          Cancel
        </ion-button>
        <ion-button expand="block" color="primary" (click)="onConfirm()" class="confirm-button">
          Confirm
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
